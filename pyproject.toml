[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scorecard-woe-logistic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "credit-scoring-core @ git+https://github.com/Patotricks15/credit-scoring-core",
  "pandas==3.1.1",
  "numpy==2.5.4",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "matplotlib==3.11.2",
  "seaborn==0.13.2",
  "lightgbm==4.7.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "jupytext==1.19.6", "nbconvert==7.17.2", "ipykernel==7.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
